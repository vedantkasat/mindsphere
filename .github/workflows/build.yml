name: Build MindSphere

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview

      - name: Build .exe
        run: pyinstaller installer/MindSphere.spec --clean --noconfirm

      - name: Zip the build
        run: Compress-Archive -Path dist/MindSphere -DestinationPath dist/MindSphere-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MindSphere-Windows
          path: dist/MindSphere-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview

      - name: Build .app
        run: pyinstaller installer/MindSphere.spec --clean --noconfirm

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "MindSphere" \
            --window-size 500 320 \
            --icon-size 100 \
            --icon "MindSphere.app" 130 150 \
            --app-drop-link 370 150 \
            --no-internet-enable \
            "dist/MindSphere-macos.dmg" \
            "dist/MindSphere.app"

      - uses: actions/upload-artifact@v4
        with:
          name: MindSphere-macOS
          path: dist/MindSphere-macos.dmg
    release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MindSphere-Windows/MindSphere-windows.zip
            artifacts/MindSphere-macOS/MindSphere-macos.dmg
          name: MindSphere v1.0.0
          body: |
            Privacy-first mental wellness companion for Indian college students.

            Downloads:
            - macOS: MindSphere-macos.dmg
            - Windows: MindSphere-windows.zip

            First run: paste your free Gemini API key from aistudio.google.com/apikey      