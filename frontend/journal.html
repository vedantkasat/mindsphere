<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal — MindSphere</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/journal.css" />
</head>
<body>
  <nav class="nav">
    <div class="logo"><a href="/" style="color:inherit;text-decoration:none;">🧠 MindSphere</a></div>
    <div class="nav-links">
      <a href="/chat.html">Chat</a>
      <a href="/journal.html" class="active">Journal</a>
      <a href="/mood.html">Mood</a>
    </div>
  </nav>

  <main class="page">
    <h2 class="page-title">Journal</h2>
    <p class="page-subtitle">Write what's on your mind. Get a gentle reflection back.</p>

    <form id="journalForm" class="journal-form">
      <textarea
        id="entryInput"
        placeholder="What happened today? How are you feeling? No structure needed — just write."
        rows="6"
        required
      ></textarea>
      <div class="form-row">
        <span class="char-count" id="charCount">0 chars</span>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save & reflect</button>
      </div>
    </form>

    <div id="latestReflection" class="reflection hidden">
      <h3>Reflection</h3>
      <div class="reflection-tags">
        <span class="tag tag-sentiment" id="rSentiment"></span>
        <span class="tag tag-themes" id="rThemes"></span>
      </div>
      <p id="rText"></p>
    </div>

    <section class="entries-section">
      <h3>Past entries</h3>
      <div id="entriesList" class="entries-list">
        <p class="muted">Loading...</p>
      </div>
    </section>
  </main>

  <script src="/static/js/journal.js"></script>
</body>
</html>
