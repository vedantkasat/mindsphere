<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood — MindSphere</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/mood.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="nav">
    <div class="logo"><a href="/" style="color:inherit;text-decoration:none;">🧠 MindSphere</a></div>
    <div class="nav-links">
      <a href="/chat.html">Chat</a>
      <a href="/journal.html">Journal</a>
      <a href="/mood.html" class="active">Mood</a>
    </div>
  </nav>

  <main class="page">
    <h2 class="page-title">Mood</h2>
    <p class="page-subtitle">How are you feeling right now? Track patterns over time.</p>

    <section class="mood-input">
      <h3 class="section-label">Log mood</h3>
      <div class="mood-picker" id="moodPicker">
        <button class="mood-btn" data-score="1" type="button">
          <span class="emoji">😢</span>
          <span class="label">Awful</span>
        </button>
        <button class="mood-btn" data-score="2" type="button">
          <span class="emoji">😕</span>
          <span class="label">Low</span>
        </button>
        <button class="mood-btn" data-score="3" type="button">
          <span class="emoji">😐</span>
          <span class="label">Okay</span>
        </button>
        <button class="mood-btn" data-score="4" type="button">
          <span class="emoji">🙂</span>
          <span class="label">Good</span>
        </button>
        <button class="mood-btn" data-score="5" type="button">
          <span class="emoji">😄</span>
          <span class="label">Great</span>
        </button>
      </div>

      <input type="text" id="moodNote" placeholder="Optional: a quick note (what made you feel this way?)" />
      <button id="logBtn" class="btn btn-primary" disabled>Log mood</button>
    </section>

    <section class="chart-section">
      <div class="section-header">
        <h3 class="section-label">Trend</h3>
        <div class="stats">
          <span class="stat"><span class="stat-label">Avg:</span> <span id="avgScore">—</span></span>
          <span class="stat"><span class="stat-label">Entries:</span> <span id="totalCount">—</span></span>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="moodChart"></canvas>
      </div>
      <p id="emptyMsg" class="muted hidden">No mood logs yet. Pick how you feel above to start.</p>
    </section>

    <section class="recent-section">
      <h3 class="section-label">Recent</h3>
      <div id="recentList" class="recent-list">
        <p class="muted">Loading...</p>
      </div>
    </section>
  </main>

  <script src="/static/js/mood.js"></script>
</body>
</html>
